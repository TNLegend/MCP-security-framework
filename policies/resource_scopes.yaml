revision: resource-scopes-v1

filesystem_scopes:
  fs.project_workspace:
    root_env: RESOURCE_ROOT_PROJECT_WORKSPACE
    allowed_operations:
      - read
      - list
    sensitivity: internal
    symlink_policy: internal-only
    denied_patterns:
      - "**/.env"
      - "**/.env.*"
      - "**/.git/**"
      - "**/secrets/**"
      - "**/.ssh/**"
      - "**/.aws/**"
      - "**/credentials*"
      - "**/id_rsa"
      - "**/id_ed25519"

  fs.user_documents:
    root_env: RESOURCE_ROOT_USER_DOCUMENTS
    allowed_operations:
      - read
      - list
    sensitivity: private
    symlink_policy: internal-only
    denied_patterns:
      - "**/.ssh/**"
      - "**/.aws/**"
      - "**/credentials*"
      - "**/id_rsa"
      - "**/id_ed25519"
      - "**/tokens/**"
      - "**/secrets/**"

  fs.legal_contracts:
    root_env: RESOURCE_ROOT_LEGAL_CONTRACTS
    allowed_operations:
      - read
    sensitivity: confidential
    symlink_policy: deny
    denied_patterns:
      - "**/.env"
      - "**/.env.*"
      - "**/secrets/**"
