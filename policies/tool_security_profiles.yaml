revision: tool-security-profiles-v1

bindings:
  - server_ref: streamable_http:http://127.0.0.1:9000/mcp
    tool_name: read_file
    operation: read
    required_capability: filesystem.read
    resource:
      adapter: filesystem
      argument_name: path
      expected_type: file
      relative_base_scope: fs.project_workspace
      allowed_scope_candidates:
        - fs.project_workspace
        - fs.user_documents
        - fs.legal_contracts

  - server_ref: streamable_http:http://127.0.0.1:9000/mcp
    tool_name: list_files
    operation: list
    required_capability: filesystem.list
    resource:
      adapter: filesystem
      argument_name: path
      expected_type: directory
      relative_base_scope: fs.project_workspace
      allowed_scope_candidates:
        - fs.project_workspace
