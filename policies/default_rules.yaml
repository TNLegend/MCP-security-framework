rules:
  - id: block_unknown_server
    description: Block calls to unknown MCP servers
    decision: BLOCK
    severity: high
    enabled: true
    match:
      server_status:
        - unknown
        - blocked

  - id: deny_invalid_arguments
    description: Block calls with invalid tool arguments
    decision: BLOCK
    severity: high
    enabled: true
    match:
      arguments_valid: false

  - id: deny_unverified_identity
    description: Block calls without verified trusted identity
    decision: BLOCK
    severity: critical
    enabled: true
    match:
      identity_status:
        - unverified

  - id: deny_invalid_or_expired_session
    description: Block calls without an active trusted session
    decision: BLOCK
    severity: critical
    enabled: true
    match:
      session_status:
        - unknown
        - missing
        - expired
        - revoked
        - invalid

  - id: deny_unknown_subject
    description: Block calls from unknown subjects
    decision: BLOCK
    severity: high
    enabled: true
    match:
      authorization_status:
        - unknown

  - id: deny_unknown_tool_security_profile
    description: Block tools without a resolved security profile
    decision: BLOCK
    severity: high
    enabled: true
    match:
      tool_profile_status:
        - unknown
        - unavailable
        - missing

  - id: deny_tool_security_profile_drift
    description: Block tools whose security profile drifted
    decision: BLOCK
    severity: high
    enabled: true
    match:
      tool_profile_status:
        - drift

  - id: deny_resource_resolution_failed
    description: Block resources that cannot be resolved safely
    decision: BLOCK
    severity: high
    enabled: true
    match:
      resource_resolution_status:
        - invalid_arguments
        - resource_not_found
        - resource_type_mismatch
        - resource_resolution_failed
        - path_null_byte
        - path_control_character
        - path_too_long
        - path_too_many_segments
        - path_unc
        - path_device
        - path_ntfs_ads
        - path_reserved_name
        - path_traversal_outside_root

  - id: deny_resource_outside_registered_scope
    description: Block resources outside registered scopes
    decision: BLOCK
    severity: high
    enabled: true
    match:
      resource_resolution_status:
        - resource_outside_registered_scope

  - id: deny_ambiguous_resource_scope
    description: Block ambiguous resource scope resolution
    decision: BLOCK
    severity: high
    enabled: true
    match:
      resource_resolution_status:
        - ambiguous_resource_scope

  - id: deny_sensitive_resource
    description: Block sensitive resource access
    decision: BLOCK
    severity: critical
    enabled: true
    match:
      resource_sensitivity:
        - secret

  - id: deny_sensitive_paths
    description: Block access to sensitive local paths
    decision: BLOCK
    severity: high
    enabled: true
    match:
      argument: path
      contains:
        - ".env"
        - ".aws/credentials"
        - "/etc/passwd"
        - "id_rsa"
        - "secrets"

  - id: deny_unclassified_capability
    description: Block requests without a classified capability
    decision: BLOCK
    severity: high
    enabled: true
    match:
      required_capability:
        - unclassified

  - id: deny_capability_not_granted
    description: Block capabilities not granted to the subject
    decision: BLOCK
    severity: high
    enabled: true
    match:
      capability_not_granted: true

  - id: deny_scope_not_granted
    description: Block resource scopes not granted for the capability
    decision: BLOCK
    severity: high
    enabled: true
    match:
      scope_not_granted: true

  - id: deny_operation_not_allowed_on_scope
    description: Block operations not allowed on the resource scope
    decision: BLOCK
    severity: high
    enabled: true
    match:
      operation_allowed_on_scope: false

  - id: require_approval_for_sensitive_tool
    description: Require human approval for sensitive tools
    decision: ASK_APPROVAL
    severity: high
    enabled: true
    match:
      tool_sensitivity:
        - high
        - critical

  - id: limit_large_outputs
    description: Limit tool calls that may return large outputs
    decision: LIMIT
    severity: medium
    enabled: true
    match:
      max_output_size_mb: 10

  - id: warn_high_risk_tool
    description: Warn when a tool has a high risk score
    decision: WARN
    severity: medium
    enabled: true
    match:
      min_tool_risk_score: 70

  - id: allow_contracts_read
    description: Allow reading files inside the contracts directory
    decision: ALLOW
    severity: low
    enabled: true
    match:
      tool_name: read_file
      argument: path
      allowed_prefixes:
        - "contracts/"
        - "fs.project_workspace:/contracts/"
        - "fs.legal_contracts:/"

  - id: log_normal_runtime_call
    description: Log normal runtime calls for audit purposes
    decision: LOG_ONLY
    severity: low
    enabled: true
