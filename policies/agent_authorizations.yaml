revision: subject-authorizations-v1

subjects:
  agent-demo:
    role: legal_agent
    grants:
      - capability: filesystem.read
        scopes:
          - fs.project_workspace
          - fs.legal_contracts
          - contracts
      - capability: filesystem.list
        scopes:
          - fs.project_workspace
          - lab_root

  llm-agent-demo:
    role: legal_agent
    grants:
      - capability: filesystem.read
        scopes:
          - fs.project_workspace
          - fs.legal_contracts
          - contracts
      - capability: filesystem.list
        scopes:
          - fs.project_workspace
          - lab_root

  agent-contract-reader:
    role: contract_reader
